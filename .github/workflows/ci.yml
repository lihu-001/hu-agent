name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build and test
        run: mvn -B package
      # 失败的测试写成 annotation，在运行页面的摘要（以及不需要登录的 check-runs API）中直接可见。
      - name: Report test failures
        if: failure()
        shell: bash
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] || continue
            if grep -qE "<<< (FAILURE|ERROR)" "$f"; then
              detail=$(grep -vE "^-+$|^Test set:" "$f" | head -n 12 | tr '\r\n' '  ' | cut -c 1-1500)
              echo "::error title=$(basename "$f" .txt)::$detail"
            fi
          done
      - name: Smoke test the packaged jar
        shell: bash
        run: |
          java -jar target/hu-agent.jar --version
          printf '/status\nexit\n' | HU_MODEL=ci HU_API_KEY=ci HU_HOME="$RUNNER_TEMP/hu-home" java -jar target/hu-agent.jar
