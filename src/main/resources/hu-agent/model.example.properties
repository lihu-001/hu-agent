# hu-agent 模型配置（UTF-8）。默认位置 ~/.hu-agent/model.properties，首次运行 hu 时按提示生成；
# 删除本文件后再运行 hu 会重新引导。环境变量 HU_PROVIDER、HU_BASE_URL、HU_MODEL、HU_API_KEY 优先于本文件。
#
# provider 接口类型：
#   openai                OpenAI 官方（Chat Completions 协议），base-url 可留空
#   anthropic             Anthropic 官方（Messages 协议），base-url 可留空
#   openai-compatible     OpenAI 格式自定义接口，填写基础地址（通常以 /v1 结尾），请求发往 <base-url>/chat/completions
#   anthropic-compatible  Anthropic 格式自定义接口，填写基础地址，请求发往 <base-url>/v1/messages
provider=openai
base-url=
model=
api-key=

# 模型最大上下文（token），输入框上方的横线据此显示剩余上下文；按所用模型填写。
max-context-tokens=1000000
# 单次回复最多输出的 token，只有 Anthropic 协议使用（该协议要求必填）。
# 留空时 Anthropic 官方取 32000，Anthropic 格式自定义接口取 8192；超过模型上限时接口会报错。
max-output-tokens=
