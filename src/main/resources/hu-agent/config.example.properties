# hu-agent 配置（UTF-8）。默认位置 ~/.hu-agent/config.properties，首次运行 hu 时按提示生成。
# 环境变量 HU_BASE_URL、HU_MODEL、HU_API_KEY 优先于本文件中的同名设置。
# 兼容 OpenAI Chat Completions 协议的接口均可使用。
openai.base-url=https://api.openai.com/v1
openai.model=
openai.api-key=
# 模型最大上下文（token），输入框上方的横线据此显示剩余上下文；按所用模型填写。
openai.max-context-tokens=1000000

# 每轮最多请求模型的次数；Shell 命令超时（秒）与输出上限（字符）。
agent.max-model-calls=10
shell.timeout-seconds=30
shell.max-output-chars=12000

# 上下文压缩：粗略字符数（非 token）超过阈值时自动总结；最近 N 个工具结果保留原文。
compact.threshold-chars=50000
compact.keep-tool-results=3

# 后台任务：background_run 启动的命令单独超时（秒），超时后终止进程树。
background.timeout-seconds=600

# 定时计划：调度线程轮询间隔（秒），计划最短触发精度为一分钟。
scheduler.poll-seconds=15

# 团队模式：默认关闭；设为 true 后可创建常驻队友（每个队友独立调用模型，费用更高）。
team.enabled=false

# /goal 目标循环：每轮最多自动续跑的次数；判断器模型留空则与 openai.model 相同。
goal.block-cap=8
goal.evaluator-model=
